# Netlify configuration for Yea I Consulting

[build]
  command = "node check-dashes.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Serve index.html for root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Clean URLs - allow /insights to work as /insights.html
[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 200

